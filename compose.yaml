name: e52modern

services:
  workbench:
    build:
      context: .
      dockerfile: Dockerfile
    image: e52modern-workbench:local
    restart: unless-stopped
    init: true
    # LOCAL ONLY on Linux host. Use SSH port forwarding to access remotely.
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - symport-build:/srv/e52modern/build
      - symport-workspace:/srv/e52modern/workspace
    environment:
      # Enroll only explicitly mounted phone volumes. Never mount the host root.
      SYMPORT_DEVICE_ROOTS: "${SYMPORT_DEVICE_ROOTS:-{}}"
      SYMPORT_BRIDGE_URL: ${SYMPORT_BRIDGE_URL:-}
      SYMPORT_BRIDGE_KEY: ${SYMPORT_BRIDGE_KEY:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/state', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  symport-build:
  symport-workspace:
