name: e52modern

services:
  workbench:
    build:
      context: .
      dockerfile: Dockerfile
    image: e52modern-workbench:local
    restart: unless-stopped
    init: true
    # LOCAL ONLY on Linux host. Use SSH port forwarding to access remotely.
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - symport-build:/srv/e52modern/build
      - symport-workspace:/srv/e52modern/workspace
      - mgo-symbian-auth:/symbian-auth:ro
    environment:
      # Enroll only explicitly mounted phone volumes. Never mount the host root.
      SYMPORT_MGO_URL: http://mgo-symbian:8766
      SYMPORT_MGO_TOKEN_FILE: /symbian-auth/agent-token
      SYMPORT_GAMMU_CONFIG: ${SYMPORT_GAMMU_CONFIG:-}
      SYMPORT_DEVICE_ROOTS: "${SYMPORT_DEVICE_ROOTS:-{}}"
      SYMPORT_BRIDGE_URL: ${SYMPORT_BRIDGE_URL:-}
      SYMPORT_BRIDGE_KEY: ${SYMPORT_BRIDGE_KEY:-}
    networks: [default, emulator]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/state', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Existing MGO agent/EKA2L1 image, pinned to the inspected contract. No emulator code is copied here.
  mgo-symbian:
    profiles: [emulator]
    image: ghcr.io/grayhex/mgo-symbian@sha256:83e62c6737a1cdcdf992bd8d3803738ff6a73b278a71118e69318446db4789cc
    restart: unless-stopped
    init: false
    environment:
      AGENT_TOKEN_FILE: /symbian-auth/agent-token
      MAX_FIRMWARE_BYTES: 2147483648
      MAX_INSTANCE_SECONDS: 7200
    volumes:
      - mgo-symbian-data:/data
      - mgo-symbian-auth:/symbian-auth
    networks: [emulator]
    read_only: true
    tmpfs: [/tmp:size=512m]
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 3g
    pids_limit: 512
    # No ports: only Workbench can reach the authenticated agent. EKA2L1 stays on agent loopback.

networks:
  emulator:
    internal: true

volumes:
  symport-build:
  symport-workspace:
  mgo-symbian-data:
  mgo-symbian-auth:
