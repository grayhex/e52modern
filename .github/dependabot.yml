version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: github-actions
    directory: /.github/actions/browser-tools
    schedule: {interval: monthly}
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
    groups:
      frontend: {update-types: [minor, patch]}
  - package-ecosystem: pip
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /
    schedule: {interval: monthly}
