name: React frontend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run format:check --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[dev]'
      - run: npm install --prefix "$RUNNER_TEMP/react-e2e" playwright@1.62.1
      - run: '"$RUNNER_TEMP/react-e2e/node_modules/.bin/playwright" install --with-deps chromium'
      - run: NODE_PATH="$RUNNER_TEMP/react-e2e/node_modules" node tools/check_react_ui.cjs
      - uses: actions/upload-artifact@v4
        with: {name: symport-react-static, path: symport/react_assets/}
