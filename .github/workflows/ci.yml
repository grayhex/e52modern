name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - name: Ruff (symport, tests)
        run: ruff check .
      - name: Syntax check of legacy tools
        run: python -m py_compile tools/*.py tools/s60/*.py

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: sudo apt-get update && sudo apt-get install -y g++
      - run: pip install -e '.[dev]'
      - name: Unit, CLI and regression tests
        run: pytest -ra

  theme:
    runs-on: ubuntu-latest
    needs: [lint, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y g++
      - run: pip install -e '.[dev]'
      - name: Build skc and bmconv from vendored sources
        run: tools/s60/build.sh
      - name: Environment survey
        run: |
          mkdir -p build/reports
          symport doctor --json --report build/reports/doctor.json
      - name: Rebuild both theme variants (legacy entry point, unchanged)
        run: python3 tools/build_theme.py
      - name: Rebuild through SymPort
        run: symport theme build --report build/reports/theme-build.json
      - name: Inspect outputs and check reproducibility
        run: symport theme inspect --reproducible --report build/reports/theme-inspect.json
      - name: Package (experimental native writer; official makesis is not available on runners)
        run: symport theme package --backend native --report build/reports/theme-package-native.json
      - name: Package without an explicit backend must report "unsupported" (exit 3), not fake success
        run: |
          set +e
          symport theme package --report build/reports/theme-package-auto.json
          test $? -eq 3
      - name: Compatibility matrix
        run: symport report matrix build/reports --report build/reports/matrix.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: symport-theme-${{ github.sha }}
          path: |
            build/reports/
            build/symport/theme/
            theme/dist/
          if-no-files-found: warn

  real-sdk:
    # Informational, non-gating: exercises SymPort against the real symbian-platform SDK (external download).
    runs-on: ubuntu-latest
    needs: [lint, tests]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Host toolchain required by the SDK (ARM-capable clang, lld, cmake)
        run: sudo apt-get update && sudo apt-get install -y clang lld cmake
      - run: pip install -e '.[dev]'
      - name: Install symbian-platform (CLI only, without the GUI console dependencies)
        run: |
          pip install --only-binary=:all: --no-deps symbian-platform
          pip install --only-binary=:all: "pydantic>=2.12,<3" "fastapi>=0.115,<1" "httpx>=0.28,<1" "msgpack>=1,<2" "pygments>=2.18,<3"
      - name: Build the SDK's E32 probe, package it, cross-check parsers
        run: tools/sdk/verify-real-sdk.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: symport-real-sdk-${{ github.sha }}
          path: build/reports/
          if-no-files-found: warn

  workbench:
    runs-on: ubuntu-latest
    needs: [lint, tests]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose config -q
      - name: Build Docker workbench image
        run: docker build -t e52modern-workbench:ci .
      - name: Launch workbench and check HTTP API
        run: |
          docker run -d --name e52modern-ui -p 127.0.0.1:8765:8765 e52modern-workbench:ci
          trap 'docker logs e52modern-ui || true; docker rm -f e52modern-ui || true' EXIT
          ready=0
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/api/state > /tmp/workbench-state.json; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          python3 -c 'import json; d=json.load(open("/tmp/workbench-state.json")); assert d["schema"] == "symport.web/1"'
          docker exec e52modern-ui python -m symport theme build --variant light --json > /tmp/workbench-build.json
          docker exec e52modern-ui python -m symport theme package --variant light --backend native --json > /tmp/workbench-package.json
          python3 -c 'import json; assert json.load(open("/tmp/workbench-build.json"))["status"] == "ok"; assert json.load(open("/tmp/workbench-package.json"))["status"] == "ok"'

  device-manager-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser script and Compose
        run: |
          node --check symport/web_assets/manager.js
          node --check symport/web_assets/library.js
          node --check symport/web_assets/suite.js
          node --check symport/web_assets/catalog.js
          docker compose config --quiet
      - name: Build Device Manager image
        run: docker build -t symport-device-manager:ci .
      - name: Smoke test HTTP and transport dependencies
        run: |
          docker run -d --name device-manager -p 127.0.0.1:8765:8765 symport-device-manager:ci
          trap 'docker logs device-manager; docker rm -f device-manager' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/api/state > /tmp/state.json; then break; fi
            sleep 1
          done
          python -c 'import json; assert json.load(open("/tmp/state.json"))["schema"] == "symport.web/1"'
          docker exec device-manager sh -c 'command -v gammu && command -v obexftp'

  phone-workspace-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e '.[dev]'
      - name: Install browser test tools outside the checkout
        run: |
          npm install --prefix "$RUNNER_TEMP/symport-browser" playwright@1.62.1
          "$RUNNER_TEMP/symport-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise contacts, files, media, packages and theme library
        run: |
          NODE_PATH="$RUNNER_TEMP/symport-browser/node_modules" node tools/check_web_ui.cjs
          NODE_PATH="$RUNNER_TEMP/symport-browser/node_modules" node tools/check_app_catalog.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-workspace-screenshots
          path: build/screenshots/
