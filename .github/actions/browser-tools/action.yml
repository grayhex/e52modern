name: Browser tools
description: Playwright with Chromium installed outside the checkout, cached between runs. Sets NODE_PATH for the checks.
inputs:
  playwright-version:
    description: Playwright version (also the cache key)
    default: "1.62.1"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - id: cache
      uses: actions/cache@v6
      with:
        path: |
          ${{ runner.temp }}/symport-browser
          ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ inputs.playwright-version }}
    - name: Install Playwright and Chromium
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/symport-browser" playwright@${{ inputs.playwright-version }}
        "$RUNNER_TEMP/symport-browser/node_modules/.bin/playwright" install --with-deps chromium
    - name: System libraries for the cached Chromium
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: '"$RUNNER_TEMP/symport-browser/node_modules/.bin/playwright" install-deps chromium'
    - name: Expose NODE_PATH
      shell: bash
      run: echo "NODE_PATH=$RUNNER_TEMP/symport-browser/node_modules" >> "$GITHUB_ENV"
