[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symport"
version = "0.1.0"
description = "SymPort Phone Workspace: contacts, files, media, local themes and development tools for Symbian S60"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["vobject>=0.9.9,<1"]

[project.optional-dependencies]
theme = ["pillow>=10"]
dev = ["pytest>=8", "ruff>=0.5", "pillow>=10"]

[project.scripts]
symport = "symport.cli:main"

[tool.setuptools.packages.find]
include = ["symport*"]

[tool.setuptools.package-data]
symport = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js", "web_assets/fonts/*.ttf", "web_assets/fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tools", "theme", "reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
